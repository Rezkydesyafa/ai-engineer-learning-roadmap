[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-engineer-learning-roadmap"
version = "0.1.0"
description = "Hands-on AI engineering learning roadmap"
requires-python = ">=3.11"
dependencies = [
  "jupyterlab>=4.0",
  "numpy>=2.0",
  "pandas>=2.0",
  "scikit-learn>=1.5",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py311"
